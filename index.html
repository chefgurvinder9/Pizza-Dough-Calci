<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Dough Calculator</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="logo-192.png" />
  <link rel="apple-touch-icon" href="logo-192.png" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      /* Warm Dough/Wheat Gradient */
      background: linear-gradient(135deg, #fdf5e6 0%, #f3e5ab 100%);
      color: #4a3728; 
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Transparent Pizza Background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('pizza-bg.jpg') center/cover no-repeat;
      opacity: 0.12;
      z-index: -2;
      filter: sepia(30%) blur(2px);
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(253, 245, 230, 0.6);
      z-index: -1;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 140px;
      height: auto;
      display: block;
      margin: 20px auto 10px;
      filter: saturate(0.8);
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #8b4513; 
    }

    .tagline {
      text-align: center;
      font-style: italic;
      font-size: 0.95rem;
      color: #6d4c41;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(139, 69, 19, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: fadeIn 0.6s ease-out;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 1.1rem;
      color: #5d4037;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      border: 2px solid #e0d4b4;
      border-radius: 12px;
      background: white;
      color: #4a3728;
      margin-bottom: 18px;
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #d2691e;
      transform: scale(1.01);
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #d2691e, #a0522d);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(210, 105, 30, 0.3);
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(210, 105, 30, 0.4);
    }

    #results {
      margin-top: 25px;
    }

    .ingredients {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #e0d4b4;
      animation: slideUp 0.6s ease-out;
    }

    .ingredients li {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed #d7ccc8;
      font-size: 1.05rem;
      color: #4e342e;
    }

    .whatsapp-btn {
      display: block;
      margin: 20px auto 0;
      padding: 14px;
      background: #4caf50;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.2);
    }

    .language-selector-container {
      text-align: right; 
      margin-bottom: 10px;
    }

    #language-select {
      padding: 8px; 
      border-radius: 8px; 
      border: 1px solid #e0d4b4; 
      background: white; 
      color: #5d4037; 
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <div class="language-selector-container">
      <select id="language-select" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="hi">हिन्दी (Hindi)</option>
      </select>
    </div>
    <img src="logo-512.png" alt="Chef Gurvinder" class="logo" />
    <h1 id="app-title">Pizza Dough Calculator</h1>
    <p class="tagline" id="app-tagline">Crafted with precision, baked with love.</p>

    <div class="card">
      <label for="flour" id="flour-label">'00' Flour (grams):</label>
      <input type="number" id="flour" placeholder="e.g., 2000" min="1" />
      <button onclick="calculate()" id="calculate-btn">Calculate Recipe</button>
    </div>

    <div id="results"></div>
  </div>

  <script>
    const LANG_STRINGS = {
      en: {
        title: 'Pizza Dough Calculator',
        tagline: 'Crafted with precision, baked with love.',
        flourLabel: "'00' Flour (grams):",
        calculateBtn: 'Calculate Recipe',
        alert: 'Please enter a valid flour amount.',
        resultsTitle: 'Perfect Dough',
        shareBtn: 'Share via WhatsApp',
        shareTitle: '*Pizza Dough Recipe* (Chef Gurvinder)\nFor *[FLOUR_AMT]g* \'00\' Flour:\n\n',
        ingredients: {
          'Salt': 'Salt', 'Sugar': 'Sugar', 'Yeast': 'Yeast', 'Oil': 'Oil', 'Water': 'Water',
          'AfterDoughOil': 'After Dough Oil', 'Semolina': 'Semolina', 'Milk': 'Milk', 'BakingSoda': 'Baking Soda'
        }
      },
      hi: {
        title: 'पिज़्ज़ा आटा कैलकुलेटर',
        tagline: 'परिशुद्धता से तैयार, प्यार से बेक किया गया।',
        flourLabel: "'00' आटा (ग्राम):",
        calculateBtn: 'रेसिपी गणना करें',
        alert: 'कृपया आटे की सही मात्रा दर्ज करें।',
        resultsTitle: 'उत्तम आटा',
        shareBtn: 'व्हाट्सएप पर शेयर करें',
        shareTitle: '*पिज़्ज़ा आटा रेसिपी* (शेफ गुरविंदर)\n*[FLOUR_AMT] ग्राम* \'00\' आटे के लिए:\n\n',
        ingredients: {
          'Salt': 'नमक', 'Sugar': 'चीनी', 'Yeast': 'यीस्ट/खमीर', 'Oil': 'तेल', 'Water': 'पानी',
          'AfterDoughOil': 'आटा गूंधने के बाद का तेल', 'Semolina': 'सूजी', 'Milk': 'दूध', 'BakingSoda': 'बेकिंग सोडा'
        }
      }
    };

    let currentLang = 'en';

    function updateUI(lang) {
      const strings = LANG_STRINGS[lang];
      document.getElementById('app-title').textContent = strings.title;
      document.getElementById('app-tagline').textContent = strings.tagline;
      document.getElementById('flour-label').textContent = strings.flourLabel;
      document.getElementById('calculate-btn').textContent = strings.calculateBtn;
      if (document.getElementById('results').innerHTML) calculate(false);
      document.getElementById('language-select').value = lang;
      currentLang = lang;
    }

    function setLanguage(lang) {
      localStorage.setItem('pizzaDoughLang', lang);
      updateUI(lang);
    }

    window.addEventListener('load', () => {
      const savedLang = localStorage.getItem('pizzaDoughLang') || 'en';
      updateUI(savedLang);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    });

    function calculate(showAlert = true) {
      const flour = parseFloat(document.getElementById('flour').value);
      const strings = LANG_STRINGS[currentLang];
      if (!flour || flour <= 0) {
        if(showAlert) alert(strings.alert);
        return;
      }

      const ratios = { salt: 0.02, sugar: 0.025, yeast: 0.02, oil: 0.06, water: 0.4, afterDoughOil: 0.01, semolina: 0.06, milk: 0.4, bakingSoda: 0.01 };
      const keys = ['Salt', 'Sugar', 'Yeast', 'Oil', 'Water', 'AfterDoughOil', 'Semolina', 'Milk', 'BakingSoda'];
      
      let list = '<ul class="ingredients">';
      let message = strings.shareTitle.replace('[FLOUR_AMT]', flour);

      for (const key of keys) {
        const val = (flour * ratios[key.charAt(0).toLowerCase() + key.slice(1)]).toFixed(2) + 'g';
        const name = strings.ingredients[key];
        list += `<li><strong>${name}:</strong> <span>${val}</span></li>`;
        message += `• ${name}: ${val}\n`;
      }
      
      document.getElementById('results').innerHTML = `
        <div class="card">
          <h2>${strings.resultsTitle}</h2>
          ${list}
          <a href="https://wa.me/?text=${encodeURIComponent(message)}" target="_blank" class="whatsapp-btn">${strings.shareBtn}</a>
        </div>`;
      if(showAlert) document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
